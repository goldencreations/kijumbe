name: kijumbe

x-kijumbe-app: &kijumbe-app
  image: kijumbe-backend:${APP_IMAGE_TAG:-latest}
  build:
    context: .
    target: production
  env_file:
    - ${BACKEND_ENV_FILE:-.env.production}
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
  networks:
    - kijumbe-internal

services:
  migrate:
    <<: *kijumbe-app
    container_name: kijumbe-migrate
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]
    healthcheck:
      disable: true

  api:
    <<: *kijumbe-app
    container_name: kijumbe-api
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    networks:
      - kijumbe-internal
      - npm-proxy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  queue:
    <<: *kijumbe-app
    container_name: kijumbe-queue
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=5", "--timeout=120", "--max-time=3600"]
    stop_grace_period: 2m
    healthcheck:
      disable: true

  scheduler:
    <<: *kijumbe-app
    container_name: kijumbe-scheduler
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  mysql:
    image: mysql:8.4
    container_name: kijumbe-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - kijumbe-mysql-data:/var/lib/mysql
    networks:
      - kijumbe-internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

networks:
  kijumbe-internal:
    driver: bridge
  npm-proxy:
    external: true
    name: ${NPM_NETWORK:-npm_default}

volumes:
  kijumbe-mysql-data:
