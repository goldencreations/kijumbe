name: kijumbe

x-kijumbe-app: &kijumbe-app
  image: kijumbe-backend:${APP_IMAGE_TAG:-latest}
  build:
    context: .
    target: production
  environment:
    APP_URL: ${APP_URL:-https://kijumbe.goldencreations.online}
    APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Dar_es_Salaam}
    DB_TIMEZONE: ${DB_TIMEZONE:-+03:00}
    TZ: ${TZ:-Africa/Dar_es_Salaam}
    DB_CONNECTION: ${DB_CONNECTION:-mysql}
    DB_HOST: ${DB_HOST:-mysql}
    DB_PORT: ${DB_PORT:-3306}
    DB_DATABASE: ${DB_DATABASE:-kijumbe}
    DB_USERNAME: ${DB_USERNAME:-kijumbe}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
    WHATSAPP_BUSINESS_ID: ${WHATSAPP_BUSINESS_ID}
    WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-${WHATSAPP_BUSINESS_ID}}
    WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-${PERMANENT_WHATSAPP_ACCESS_TOKEN}}
    WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-${WHATSAPP_VERIFY_TOKEN}}
    WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-${WHATSAPP_WEBHOOK_VERIFY_TOKEN}}
    WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-${WHATSAPP_GRAPH_VERSION:-v26.0}}
    WHATSAPP_MEDIA_MODE: ${WHATSAPP_MEDIA_MODE:-meta_id}
    WHATSAPP_LIVE_ENABLED: ${WHATSAPP_LIVE_ENABLED:-false}
  env_file:
    - ${BACKEND_ENV_FILE:-.env.production}
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
  networks:
    - kijumbe-internal

services:
  migrate:
    <<: *kijumbe-app
    container_name: kijumbe-migrate
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]
    healthcheck:
      disable: true

  api:
    <<: *kijumbe-app
    container_name: kijumbe-api
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    networks:
      - kijumbe-internal
      - npm-proxy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  queue:
    <<: *kijumbe-app
    container_name: kijumbe-queue
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=5", "--timeout=120", "--max-time=3600"]
    stop_grace_period: 2m
    healthcheck:
      disable: true

  scheduler:
    <<: *kijumbe-app
    container_name: kijumbe-scheduler
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  mysql:
    image: mysql:8.4
    container_name: kijumbe-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Africa/Dar_es_Salaam}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: ["--default-time-zone=+03:00"]
    volumes:
      - kijumbe-mysql-data:/var/lib/mysql
    networks:
      - kijumbe-internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: kijumbe-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_VERBOSE: Kijumbe MySQL
      PMA_ABSOLUTE_URI: ${PHPMYADMIN_URL:-https://db-kijumbe.goldencreations.online/}
      UPLOAD_LIMIT: 64M
      HIDE_PHP_VERSION: "true"
      TZ: Africa/Dar_es_Salaam
    expose:
      - "80"
    networks:
      - kijumbe-internal
      - npm-proxy

networks:
  kijumbe-internal:
    driver: bridge
  npm-proxy:
    external: true
    name: ${NPM_NETWORK:-npm_default}

volumes:
  kijumbe-mysql-data:
